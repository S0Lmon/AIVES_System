# Builds the Windows-targeted solution and runs its tests on pushes and pull requests.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore AIVES_System.slnx

      - name: Build
        run: dotnet build AIVES_System.slnx --configuration Release --no-restore

      - name: Test
        env:
          AIVES_TEST_SQL_CONNECTION: Server=(localdb)\MSSQLLocalDB;Integrated Security=true;TrustServerCertificate=True
        run: >-
          dotnet test AIVES.Tests/AIVES.Tests.csproj --configuration Release --no-build
          --logger "trx;LogFileName=results.trx" --logger "console;verbosity=normal"
          --results-directory TestResults

      - name: Summarise results
        if: always()
        shell: python
        run: |
          import glob, os, xml.etree.ElementTree as ET
          ns = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
          lines = ["## Test results", ""]
          for path in glob.glob("TestResults/*.trx"):
              root = ET.parse(path).getroot()
              c = root.find("t:ResultSummary/t:Counters", ns).attrib
              lines.append(f"**{c['passed']} passed**, {c['failed']} failed, {int(c['total']) - int(c['executed'])} skipped, {c['total']} total")
              failed = [r.get("testName") for r in root.iterfind("t:Results/t:UnitTestResult", ns) if r.get("outcome") == "Failed"]
              lines += [""] + [f"- ❌ `{name}`" for name in failed]
          if len(lines) == 2:
              lines.append("No results file was written; check the Test step log.")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n".join(lines) + "\n")

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore

  javascript:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Runs wwwroot/js/interview.js in a fake browser (node:vm): recording and speech stream paths.
      - name: Test the viva page script
        run: node --test scripts/tests/*.test.cjs
