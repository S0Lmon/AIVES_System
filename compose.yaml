name: aives

# Startup order: sqlserver (healthy) → migrate (applies migrations + seed, exits)
# → db-init (creates the least-privilege aives_app login, exits) → web × N → caddy.

x-app-build: &app-build
  context: .
  dockerfile: AIVES.WebMVC/Dockerfile

x-app-environment: &app-environment
  ASPNETCORE_ENVIRONMENT: Production
  ASPNETCORE_HTTP_PORTS: 8080
  ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
  ReverseProxy__TerminatesHttps: "true"

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: aives-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "${MSSQL_PID:-Express}"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD is required}"
    volumes:
      - aives-sql-data:/var/opt/mssql
    networks:
      - aives-network
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # One-shot: the only container that connects as sa and changes the schema.
  migrate:
    build: *app-build
    image: aives-web:latest
    command: ["--migrate-only"]
    restart: "no"
    environment:
      <<: *app-environment
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=AIVES;User Id=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True;MultipleActiveResultSets=true"
      DemoAccount__Enabled: "${DEMO_ACCOUNT_ENABLED:-false}"
      DemoAccount__Email: "${DEMO_ACCOUNT_EMAIL:-}"
      DemoAccount__Password: "${DEMO_ACCOUNT_PASSWORD:-}"
      DemoAccount__DisplayName: "${DEMO_ACCOUNT_DISPLAY_NAME:-AIVES Demo}"
      DemoAccount__ResetPasswordOnStartup: "${DEMO_ACCOUNT_RESET_PASSWORD:-false}"
      AdminAccess__Emails__0: "${ADMIN_EMAIL:-}"
    networks:
      - aives-network
    depends_on:
      sqlserver:
        condition: service_healthy

  # One-shot: creates/updates the aives_app login with read/write rights only.
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    entrypoint: ["/opt/mssql-tools18/bin/sqlcmd"]
    command: ["-S", "sqlserver", "-U", "sa", "-C", "-b", "-i", "/scripts/create-app-login.sql"]
    restart: "no"
    environment:
      SQLCMDPASSWORD: "${MSSQL_SA_PASSWORD}"
      APP_PASSWORD: "${MSSQL_APP_PASSWORD:?MSSQL_APP_PASSWORD is required}"
    volumes:
      - ./scripts/sql:/scripts:ro
    networks:
      - aives-network
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build: *app-build
    image: aives-web:latest
    restart: unless-stopped
    deploy:
      replicas: ${AIVES_WEB_REPLICAS:-2}
    environment:
      <<: *app-environment
      Database__MigrateOnStartup: "false"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=AIVES;User Id=aives_app;Password=${MSSQL_APP_PASSWORD};Encrypt=True;TrustServerCertificate=True;MultipleActiveResultSets=true"
      # Encrypts the shared Data Protection keys at rest; create it with scripts/preflight.sh.
      DataProtection__CertificatePath: /run/secrets/dataprotection-cert
      DataProtection__CertificatePassword: "${DATAPROTECTION_CERT_PASSWORD:?DATAPROTECTION_CERT_PASSWORD is required}"
      Gemini__ApiKey: "${GEMINI_API_KEY:-}"
      Gemini__Model: "${GEMINI_MODEL:-gemini-3.8-flash}"
      # Fast model for live follow-up questions during the AI viva (about 1 s per decision).
      Interview__Model: "${INTERVIEW_MODEL:-gemini-3.5-flash-lite}"
      Ollama__Enabled: "${OLLAMA_ENABLED:-false}"
      Ollama__BaseUrl: "${OLLAMA_BASE_URL:-http://ollama:11434}"
      Ollama__Model: "${OLLAMA_MODEL:-phi3:mini}"
      Authentication__Google__ClientId: "${GOOGLE_CLIENT_ID:-}"
      Authentication__Google__ClientSecret: "${GOOGLE_CLIENT_SECRET:-}"
      GmailSmtp__Host: "${GMAIL_SMTP_HOST:-smtp.gmail.com}"
      GmailSmtp__Port: "${GMAIL_SMTP_PORT:-587}"
      GmailSmtp__Username: "${GMAIL_USERNAME:-}"
      GmailSmtp__AppPassword: "${GMAIL_APP_PASSWORD:-}"
      GmailSmtp__SenderName: "${GMAIL_SENDER_NAME:-AIVES}"
      Registration__AllowedEmailDomains: "${REGISTRATION_EMAIL_DOMAINS:-gmail.com,fpt.edu.vn}"
    expose:
      - "8080"
    secrets:
      - dataprotection-cert
    networks:
      - aives-network
    healthcheck:
      # The runtime image has no curl; bash's /dev/tcp is enough for a GET /health.
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      db-init:
        condition: service_completed_successfully

  caddy:
    image: caddy:2-alpine
    container_name: aives-caddy
    restart: unless-stopped
    environment:
      # A domain (TLS by Caddy), "localhost", or ":80" behind Cloudflare Tunnel.
      AIVES_CADDY_SITE: "${AIVES_CADDY_SITE:-${AIVES_DOMAIN:-localhost}}"
    ports:
      - "${AIVES_HTTP_PORT:-80}:80"
      - "${AIVES_HTTPS_PORT:-443}:443"
      - "${AIVES_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - aives-network
    depends_on:
      - web

  # Optional: publish through a Cloudflare Tunnel instead of opening ports 80/443 on the router.
  # Enabled by COMPOSE_PROFILES=tunnel in .env; the tunnel's public hostname points to http://caddy:80.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: aives-cloudflared
    profiles: ["tunnel"]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: "${CLOUDFLARE_TUNNEL_TOKEN:-}"
    networks:
      - aives-network
    depends_on:
      - caddy

  # Optional: a temporary https://<random>.trycloudflare.com address with no domain or Cloudflare
  # account. Enabled by COMPOSE_PROFILES=quicktunnel; the address changes whenever this container
  # restarts (read it with: docker compose logs quicktunnel | grep trycloudflare.com).
  quicktunnel:
    image: cloudflare/cloudflared:latest
    container_name: aives-quicktunnel
    profiles: ["quicktunnel"]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--url", "http://caddy:80"]
    networks:
      - aives-network
    depends_on:
      - caddy

  # Optional local model: docker compose --profile ollama up -d, then set OLLAMA_ENABLED=true.
  ollama:
    image: ollama/ollama:latest
    container_name: aives-ollama
    profiles: ["ollama"]
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - aives-network

secrets:
  dataprotection-cert:
    file: ./secrets/dataprotection.pfx

volumes:
  aives-sql-data:
    name: aives-sql-data
  caddy-data:
    name: aives-caddy-data
  caddy-config:
    name: aives-caddy-config
  ollama-models:
    name: aives-ollama-models

networks:
  aives-network:
    name: aives-network
    driver: bridge
