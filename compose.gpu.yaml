# Optional: run Whisper on an NVIDIA GPU (CUDA) instead of the CPU.
#
# Needs an NVIDIA card with compute capability 5.0–8.x (GTX 900 series and newer), a driver with CUDA 12
# support, and Docker able to pass the GPU through (Docker Desktop with WSL 2, or Linux with the NVIDIA
# Container Toolkit). Check with: docker run --rm --gpus all mcr.microsoft.com/dotnet/aspnet:10.0 nvidia-smi
#
# Enable it by listing this file in COMPOSE_FILE in .env (";" separates files on Windows, ":" on Linux),
# keeping any other compose files you use, then rebuild:
#   COMPOSE_FILE=compose.yaml;compose.gpu.yaml
#   docker compose up -d --build
# Remove it from COMPOSE_FILE to go back to the CPU image.

services:
  web:
    build:
      target: runtime-cuda
    # Its own tag: migrate still uses the CPU image aives-web:latest.
    image: aives-web:cuda
    gpus: all
    environment:
      Speech__UseGpu: "true"
      # Empty = preview with the main model (small). On a GPU it is faster than ggml-base, which gets most
      # Vietnamese words wrong and keeps re-decoding at higher temperatures (GTX 1070: 0.75 s vs 3.8 s for 3 s of audio).
      Speech__WhisperPreviewModel: ""
